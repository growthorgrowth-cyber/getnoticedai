<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin">
  <title>Secure Client Onboarding | Get Noticed AI</title>
  <style>
    :root { --bg:#07111a; --surface:#0d1b26; --line:#1f3947; --text:#e9f5f1; --muted:#a8c2bc; --accent:#3fa896; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { padding:18px max(20px,calc((100vw - 1100px)/2)); border-bottom:1px solid var(--line); background:rgba(7,17,26,.96); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.04em; }
    .dot { width:13px; height:13px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px rgba(63,168,150,.13); }
    main { width:min(1120px,100%); margin:0 auto; padding:32px 20px 48px; }
    .intro { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin:0 0 24px; }
    h1 { margin:0 0 7px; font-size:clamp(1.7rem,4vw,2.5rem); letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .secure { white-space:nowrap; border:1px solid #27685e; color:#8ee3d2; background:#0d2929; border-radius:999px; padding:7px 10px; font-size:.78rem; font-weight:700; }
    #intake { width:100%; min-height:1040px; border:1px solid var(--line); border-radius:18px; background:#07111a; overflow:hidden; }
    .state { max-width:650px; margin:72px auto; padding:32px; text-align:center; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .state h2 { margin:0 0 10px; font-size:1.35rem; }
    .state a { display:inline-block; margin-top:20px; color:#fff; background:var(--accent); padding:11px 16px; text-decoration:none; border-radius:9px; font-weight:800; }
    @media (max-width:650px) { .intro { display:block; } .secure { display:inline-block; margin-top:14px; } main { padding:24px 14px; } #intake { min-height:1220px; border-radius:12px; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="dot"></span>GET NOTICED AI</div></header>
  <main>
    <div class="intro"><div><h1>Secure Client Onboarding</h1><p>Complete your private setup form so we can start building your local visibility system.</p></div><span class="secure">PRIVATE INVITATION</span></div>
    <div id="mount"></div>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const mount = document.getElementById('mount');
    if (!token || token.length < 32) {
      mount.innerHTML = '<section class="state"><h2>Your private onboarding link is on its way</h2><p>For your protection, client onboarding is available only through a private invitation sent after payment is confirmed.</p><a href="sms:+17272709961?body=Hi%20Eric%2C%20I%20need%20my%20secure%20Get%20Noticed%20AI%20onboarding%20link.">Text for My Secure Link</a></section>';
    } else {
      const iframe = document.createElement('iframe');
      iframe.id = 'intake';
      iframe.title = 'Get Noticed AI secure onboarding form';
      iframe.referrerPolicy = 'strict-origin';
      iframe.src = 'https://gnaonboard-84sydfuq.manus.space/onboard?token=' + encodeURIComponent(token);
      mount.appendChild(iframe);
    }
  </script>
</body>
</html>
