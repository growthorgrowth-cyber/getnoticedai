<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin">
  <title>Secure Client Onboarding | Get Noticed AI</title>
  <style>
    :root { --bg:#07111a; --surface:#0d1b26; --line:#1f3947; --text:#e9f5f1; --muted:#a8c2bc; --accent:#3fa896; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { padding:18px max(20px,calc((100vw - 1100px)/2)); border-bottom:1px solid var(--line); background:rgba(7,17,26,.96); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.04em; }
    .dot { width:13px; height:13px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px rgba(63,168,150,.13); }
    main { width:min(1120px,100%); margin:0 auto; padding:32px 20px 48px; }
    .intro { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin:0 0 24px; }
    h1 { margin:0 0 7px; font-size:clamp(1.7rem,4vw,2.5rem); letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .secure { white-space:nowrap; border:1px solid #27685e; color:#8ee3d2; background:#0d2929; border-radius:999px; padding:7px 10px; font-size:.78rem; font-weight:700; }
    #intake { width:100%; min-height:1040px; border:1px solid var(--line); border-radius:18px; background:#07111a; overflow:hidden; }
    .state { max-width:650px; margin:72px auto; padding:32px; text-align:center; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .state h2 { margin:0 0 10px; font-size:1.35rem; }
    .state form { display:grid; gap:12px; margin:22px auto 0; max-width:420px; text-align:left; }
    .state label { color:var(--muted); font-size:.88rem; font-weight:700; }
    .state input,.state select { width:100%; border:1px solid var(--line); background:#07111a; color:var(--text); border-radius:9px; padding:12px; font:inherit; }
    .state button { border:0; color:#fff; background:var(--accent); padding:12px 16px; text-decoration:none; border-radius:9px; font:inherit; font-weight:800; cursor:pointer; }
    .state button:disabled { opacity:.65; cursor:wait; }
    .state small { display:block; color:var(--muted); line-height:1.45; margin-top:8px; }
    @media (max-width:650px) { .intro { display:block; } .secure { display:inline-block; margin-top:14px; } main { padding:24px 14px; } #intake { min-height:1220px; border-radius:12px; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="dot"></span>GET NOTICED AI</div></header>
  <main>
    <div class="intro"><div><h1>Secure Client Onboarding</h1><p>Complete your private setup form so we can start building your local visibility system.</p></div><span class="secure">PRIVATE INVITATION</span></div>
    <div id="mount"></div>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const mount = document.getElementById('mount');
    if (!token || token.length < 32) {
      mount.innerHTML = '<section class="state"><h2>Request your secure onboarding link</h2><p>Enter the email address you used when you purchased. If it matches a paid Get Noticed AI account, we will send a private link by email and text.</p><form id="request-link"><label>Purchase email<input type="email" name="email" autocomplete="email" required placeholder="you@business.com"></label><label>Plan<select name="plan"><option value="Growth">Growth</option><option value="Authority">Authority</option></select></label><button type="submit">Send my secure link</button><small id="request-status">For security, we show the same confirmation whether or not an email is on file.</small></form></section>';
      document.getElementById('request-link').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button');
        button.disabled = true;
        button.textContent = 'Sending…';
        try {
          await fetch('https://gnaonboard-84sydfuq.manus.space/api/request-onboarding-link', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email: form.email.value, plan: form.plan.value }) });
          document.getElementById('request-status').textContent = 'If the email matches a paid account, your secure link is on its way. Check your inbox and text messages.';
        } catch (_) {
          document.getElementById('request-status').textContent = 'We could not confirm delivery right now. Please text (727) 270-9961 for help.';
        } finally { button.disabled = false; button.textContent = 'Send my secure link'; }
      });
    } else {
      const iframe = document.createElement('iframe');
      iframe.id = 'intake';
      iframe.title = 'Get Noticed AI secure onboarding form';
      iframe.referrerPolicy = 'strict-origin';
      iframe.src = 'https://gnaonboard-84sydfuq.manus.space/onboard?token=' + encodeURIComponent(token);
      mount.appendChild(iframe);
    }
  </script>
<!-- Get Noticed AI CRM external tracking -->
<script src="https://link.getnoticedai.com/js/external-tracking.js" data-tracking-id="tk_fe47b95ddb0b4430a78a80bbbcf0ce96"></script>
<!-- End Get Noticed AI CRM external tracking -->
</body>
</html>
